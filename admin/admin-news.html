<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประกาศข่าวทั้งหมด - Adventure Village</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="landing-container admin-container" id="adminWrapper">

        <!-- NAV TOP BAR -->
        <nav class="admin-nav-bar with-back">
            <a href="admin-dashboard.html" class="back-link">← กลับศูนย์ควบคุมงานซ่อม</a>

            <div class="admin-top-controls">
                <div class="user-menu-wrapper">
                    <div class="user-menu-dropdown" onclick="toggleAdminMenu()">
                        <div class="user-avatar-sm">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                            </svg>
                        </div>
                        <span class="dropdown-arrow">▼</span>
                    </div>

                    <div class="profile-dropdown-card" id="adminProfileDropdown">
                        <div class="dropdown-header">
                            <div class="dropdown-avatar">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                                </svg>
                            </div>
                            <div class="dropdown-user-info">
                                <h4 id="adminDropdownName">คุณ ปรียา มงคล</h4>
                                <p>🏢 นิติบุคคล (แอดมิน)</p>
                                <p>🏠 สำนักงานส่วนกลาง</p>
                            </div>
                        </div>
                        <hr class="dropdown-divider">
                        <button type="button" class="btn-logout" onclick="clearAuthSessionAndLogout()">ออกจากระบบ</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- MAIN NEWS CONTENT -->
        <main class="news-page-main">
            <h1 class="news-page-heading">ประกาศข่าวประชาสัมพันธ์</h1>

            <!-- กล่องเลือกเทมเพลตประกาศข่าวที่บันทึกไว้ (ไม่มีวันหมดอายุ) -->
            <section class="news-editor-card" id="newsTemplateSection">
                <div class="news-editor-header">
                    <h2 class="news-editor-title">📋 เทมเพลตข่าวที่บันทึกไว้ (<span id="newsTemplatesCount">0</span>)</h2>
                    <span class="template-hint-text">คลิก "นำมาใช้ประกาศ" เพื่อดึงรูปและข้อความไปแก้ไขวันที่สำหรับรอบใหม่</span>
                </div>
                <div class="news-templates-grid" id="newsTemplatesList">
                    <!-- แสดงรายการเทมเพลตอัตโนมัติ -->
                </div>
            </section>

            <!-- กล่องสร้าง / แก้ไขประกาศข่าว -->
            <section class="news-editor-card" id="newsEditorSection">
                <div class="news-editor-header">
                    <h2 class="news-editor-title" id="newsEditorTitle">📢 สร้างประกาศข่าวประชาสัมพันธ์ใหม่</h2>
                    <span class="news-toast-msg" id="newsToastMsg">✅ บันทึกข้อมูลเรียบร้อยแล้ว</span>
                </div>

                <form onsubmit="submitNewsPageForm(event)">
                    <input type="hidden" id="editNewsId">
                    <input type="hidden" id="newsImageData" value="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27400%27%20height=%27250%27%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20fill=%27%23e2e8f0%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20dominant-baseline=%27middle%27%20text-anchor=%27middle%27%20fill=%27%2364748b%27%20font-family=%27sans-serif%27%20font-size=%2720%27%20font-weight=%27bold%27%3EADVENTURE%20VILLAGE%3C/text%3E%3C/svg%3E">

                    <div class="news-editor-grid">
                        <!-- อัปโหลดรูปประกอบ -->
                        <div class="news-upload-col">
                            <label for="newsFileInput" class="news-image-dropzone" title="คลิกเพื่อเลือกรูปภาพ">
                                <img id="newsFormPreviewImg" src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27400%27%20height=%27250%27%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20fill=%27%23e2e8f0%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20dominant-baseline=%27middle%27%20text-anchor=%27middle%27%20fill=%27%2364748b%27%20font-family=%27sans-serif%27%20font-size=%2720%27%20font-weight=%27bold%27%3EADVENTURE%20VILLAGE%3C/text%3E%3C/svg%3E" alt="ตัวอย่างรูปประกาศ">
                                <span class="news-upload-badge">📷 เปลี่ยนรูปภาพ</span>
                            </label>
                            <input type="file" id="newsFileInput" accept="image/*" onchange="handleNewsImageUpload(event)" hidden>
                            <span class="news-date-red" id="newsPreviewDate">ลง ณ วันที่ --/--/----</span>
                        </div>

                        <!-- พิมพ์เนื้อหาประกาศ -->
                        <div class="news-input-col">
                            <textarea id="newsContentInput" class="news-content-textarea"
                                placeholder="พิมพ์รายละเอียดประกาศข่าวประชาสัมพันธ์ที่นี่..." required></textarea>

                            <div class="news-editor-actions">
                                <button type="button" class="btn-action btn-red" id="cancelEditNewsBtn"
                                    style="display: none;" onclick="cancelEditNewsCard()">ยกเลิกการแก้ไข</button>
                                <button type="button" class="btn-news-template" onclick="saveEditorAsTemplate()">
                                    <span>💾 บันทึกเป็นเทมเพลต</span>
                                </button>
                                <button type="submit" class="btn-pill-dark" id="submitNewsBtn">
                                    <span>+ โพสต์ประกาศข่าว</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>

            <!-- รายการข่าวที่ประกาศอยู่ทั้งหมด -->
            <section class="news-cards-stack" id="adminNewsCardsList">
                <!-- แสดงการ์ดข่าวทั้งหมด -->
            </section>
        </main>

    </div>

    <script src="/admin.js"></script>
    <script src="/theme.js"></script>
</body>

</html>
