<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกบทบาทของคุณ - Adventure Village</title>
    <link rel="stylesheet" href="/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="landing-container">
        <!-- ชั้นที่ 1: รูปภาพพื้นหลัง -->
        <div class="bg-image"></div>

        <!-- ชั้นที่ 2: แผ่นสีดำโปร่งแสง -->
        <div class="bg-overlay"></div>

        <!-- ชั้นที่ 3: เนื้อหาหน้าเลือกบทบาท -->
        <div class="content-wrapper">

            <!-- NAV TOP: ปุ่มกลับหน้าแรก -->
            <nav class="register-nav">
                <a href="/index.html" class="back-link">← กลับหน้าแรก</a>
            </nav>

            <!-- ROLE SELECTION CONTAINER -->
            <main class="select-role-container">
                <h1 class="select-role-title">เลือกบทบาทของคุณ</h1>

                <!-- FROSTED GLASS CARD CONTAINER -->
                <div class="select-role-card">
                    <div class="role-grid">

                        <!-- บทบาท: ลูกบ้าน -->
                        <button class="role-item" onclick="selectRole('resident')">
                            <div class="role-icon">
                                <!-- User / Resident Icon -->
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                                </svg>
                            </div>
                            <span class="role-label">ลูกบ้าน</span>
                        </button>

                        <!-- บทบาท: ช่าง -->
                        <button class="role-item" onclick="selectRole('technician')">
                            <div class="role-icon">
                                <!-- Hard Hat / Technician Icon -->
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 3a9 9 0 0 0-9 9v1h18v-1a9 9 0 0 0-9-9zm-8 11v2h16v-2H4zm-1 3v1a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-1H3z" />
                                </svg>
                            </div>
                            <span class="role-label">ช่าง</span>
                        </button>

                        <!-- บทบาท: แอดมิน -->
                        <button class="role-item" onclick="selectRole('admin')">
                            <div class="role-icon">
                                <!-- Headset / Admin Icon -->
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z" />
                                </svg>
                            </div>
                            <span class="role-label">แอดมิน</span>
                        </button>

                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="/script.js"></script>
    <script src="/theme.js"></script>
</body>

</html>
