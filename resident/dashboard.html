<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลักลูกบ้าน - Adventure Village</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Google Fonts: Prompt -->
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="landing-container">
        <!-- ชั้นที่ 1: รูปภาพพื้นหลัง -->
        <div class="bg-image"></div>

        <!-- ชั้นที่ 2: แผ่นสีดำโปร่งแสง -->
        <div class="bg-overlay"></div>

        <!-- ชั้นที่ 3: เนื้อหาหน้าหลักลูกบ้าน -->
        <div class="content-wrapper">

            <!-- NAV TOP BAR (ไอคอนโปรไฟล์มุมขวาบน) -->
            <nav class="dashboard-nav">
                <div class="user-menu-wrapper">
                    <!-- ปุ่มไอคอนโปรไฟล์ -->
                    <div class="user-menu-dropdown" onclick="toggleUserMenu()">
                        <div class="user-avatar-sm">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                            </svg>
                        </div>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <!-- POPUP PROFILE DROPDOWN (เปิด/ปิด เมื่อกดที่ไอคอนโปรไฟล์) -->
                    <div class="profile-dropdown-card" id="profileDropdown">
                        <div class="dropdown-header">
                            <div class="dropdown-avatar">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                                </svg>
                            </div>
                            <div class="dropdown-user-info">
                                <h4 id="dropdownName">คุณ สมศรี ซิกเซเว่น</h4>
                                <p id="dropdownHouse">🏠 บ้านเลขที่ 67/67</p>
                                <p id="dropdownPhone">📞 067-676-6767</p>
                            </div>
                        </div>
                        <hr class="dropdown-divider">
                        <button type="button" class="btn-logout" onclick="clearAuthSessionAndLogout()">ออกจากระบบ</button>
                    </div>
                </div>
            </nav>

            <!-- MAIN DASHBOARD CONTENT -->
            <main class="dashboard-main">

                <!-- HEADER TITLES -->
                <div class="dashboard-header-titles">
                    <h1 class="main-title">ADVENTURE VILLAGE</h1>
                    <h2 class="sub-title">ยินดีต้อนรับ คุณ สมศรี ซิกเซเว่น สู่หมู่บ้านผจญภัย</h2>
                </div>

                <!-- PROFILE & QUICK ACTIONS CARD -->
                <div class="user-profile-card">
                    <div class="profile-left">
                        <div class="profile-avatar-lg">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" />
                            </svg>
                        </div>
                        <div class="profile-info">
                            <h3 class="profile-name" id="userFullname">สวัสดี, คุณ สมศรี ซิกเซเว่น</h3>
                            <div class="profile-meta">
                                <span id="userHouseNo">🏠 บ้านเลขที่ 67/67 (ซอยซอย)</span>
                                <span id="userPhone">📞 067-676-6767</span>
                            </div>
                        </div>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="profile-actions">
                        <button class="btn-action btn-red" onclick="handleNewReport()">
                            <span class="btn-icon">+</span>
                            <span>แจ้งปัญหาใหม่</span>
                        </button>
                        <button class="btn-action btn-green" onclick="handleCheckStatus()">
                            <span class="btn-icon">🔍</span>
                            <span>ตรวจสอบสถานะ</span>
                        </button>
                    </div>
                </div>

                <!-- ANNOUNCEMENTS SECTION (อ่านได้อย่างเดียว เฉพาะแอดมินที่เปลี่ยนรูปและแก้ไขได้) -->
                <section class="news-section">
                    <div class="news-header-badge">
                        <h2>ข่าวประชาสัมพันธ์</h2>
                    </div>

                    <div class="news-card" id="residentNewsCard">
                        <!-- แสดงรายการข่าวอัตโนมัติจากข้อมูลที่แอดมินประกาศไว้ -->
                    </div>
                </section>

            </main>

        </div>
    </div>

    <!-- POPUP อ่านข่าวประชาสัมพันธ์ฉบับเต็ม (Read-Only สำหรับลูกบ้าน) -->
    <div class="resident-news-modal" id="residentNewsModal" onclick="closeResidentNewsModal()">
        <div class="resident-news-modal-card" onclick="event.stopPropagation()">
            <div class="resident-modal-top">
                <h3>📢 ประกาศข่าวประชาสัมพันธ์</h3>
                <button type="button" class="resident-modal-close" onclick="closeResidentNewsModal()">×</button>
            </div>
            <img id="residentModalImg" src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27400%27%20height=%27250%27%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20fill=%27%23e2e8f0%27/%3E%3Ctext%20x=%2750%25%27%20y=%2750%25%27%20dominant-baseline=%27middle%27%20text-anchor=%27middle%27%20fill=%27%2364748b%27%20font-family=%27sans-serif%27%20font-size=%2720%27%20font-weight=%27bold%27%3EADVENTURE%20VILLAGE%3C/text%3E%3C/svg%3E" alt="รูปประกอบข่าวประชาสัมพันธ์">
            <div class="news-date" id="residentModalDate">ลง ณ วันที่ --/--/----</div>
            <p class="resident-modal-text" id="residentModalContent"></p>
        </div>
    </div>

    <script src="/script.js"></script>
    <script src="/theme.js"></script>
</body>

</html>
